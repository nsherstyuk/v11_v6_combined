# IBC config — Mac template
# ----------------------------------------------------------------------------
# Source of truth for IBC supervision of IB Gateway on macOS. Generated from
# the runbook at docs/ops/macbook_migration.md. The Windows snapshot in
# docs/ops/ibc_config.ini.snapshot was NOT copied because it has CRLF line
# endings and Windows-style paths.
#
# Install:
#   1. Fill in IbLoginId and IbPassword below.
#   2. Copy this file to ~/ibc/config.ini
#         mkdir -p ~/ibc
#         cp docs/ops/ibc_config.mac.template.ini ~/ibc/config.ini
#   3. Lock down permissions:
#         chmod 600 ~/ibc/config.ini
#   4. NEVER commit ~/ibc/config.ini or this file (after fill-in) anywhere.
#      The active config holds the IB password in plaintext — see security
#      note in docs/ops/ibc_setup.md.
# ----------------------------------------------------------------------------

# === SECRETS — fill in before first run ===
# Same IBKR username/password used on the Windows host. Use your *paper*
# account credentials. Live (4001) is not enabled in this config.
IbLoginId=
IbPassword=

# === Trading mode ===
TradingMode=paper

# === Restart schedule ===
# CRITICAL: do not change AutoRestartTime without re-reading
# docs/ops/ibc_setup.md and docs/journal/2026-05-01_paper_zero_trades_root_cause_and_ibc_fixes.md.
# 22:00 ET is chosen to avoid the v11 ORB trade window (08:00–16:00 UTC =
# 04:00–12:00 ET). The IBKR-default 04:00 ET caused the 2-week zero-trades
# incident and must NEVER be re-introduced.
AutoRestartTime=22:00
ColdRestartTime=14:00

# === API ===
# 4002 = paper API port. v11 connects here. Set explicitly in IBC because
# the Gateway-UI value gets overridden by IBC at every login.
OverrideTwsApiPort=4002
ReadOnlyApi=no

# === Safety ===
# TwoFactorTimeoutAction=exit so a missed 2FA prompt kills the process
# cleanly instead of leaving a zombie waiting forever. The wrapper
# (gatewaystart.sh / the v11 wrapper) will respawn it.
TwoFactorTimeoutAction=exit
AcceptIncomingConnectionAction=accept
AllowBlindTrading=no
AcceptNonBrokerageAccountWarning=yes
MinimizeMainWindow=no

# === FIX CTCI gateway disabled ===
FIX=no

# === IBC internal command channel ===
CommandServerPort=7462
